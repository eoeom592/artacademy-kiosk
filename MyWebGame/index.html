<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffa8a8">
  <title>재료비 기입표</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #ffffff; }

    #loading-screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #ffffff; z-index: 100;
    }
    #loading-title {
      font-family: sans-serif; font-size: 28px;
      color: #333; margin-bottom: 32px; letter-spacing: 4px;
    }
    #progress-bar-bg {
      width: 300px; height: 8px;
      background: #f0f0f0; border-radius: 4px; overflow: hidden;
    }
    #progress-bar {
      width: 0%; height: 100%;
      background: #ffa8a8; border-radius: 4px;
      transition: width 0.2s ease;
    }
    #loading-pct {
      font-family: sans-serif; font-size: 14px;
      color: #aaa; margin-top: 12px;
    }

    #unity-canvas {
      width: 100%; height: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <div id="loading-screen">
    <div id="loading-title">재료비 기입표</div>
    <div id="progress-bar-bg">
      <div id="progress-bar"></div>
    </div>
    <div id="loading-pct">로딩 중...</div>
  </div>

  <canvas id="unity-canvas" tabindex="-1"></canvas>

  <script>
    // ── PWA 서비스 워커 등록 ──────────────────────────────────────
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('[PWA] Service Worker 등록:', reg.scope))
          .catch(err => console.warn('[PWA] Service Worker 등록 실패:', err));
      });
    }

    // ── Unity WebGL 로더 ─────────────────────────────────────────
    var buildUrl   = "Build";
    var loaderUrl  = buildUrl + "/MyWebGame.loader.js";
    var config = {
      dataUrl:       buildUrl + "/MyWebGame.data.unityweb",
      frameworkUrl:  buildUrl + "/MyWebGame.framework.js.unityweb",
      codeUrl:       buildUrl + "/MyWebGame.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName:   "DefaultCompany",
      productName:   "0801 학원",
      productVersion:"0.1.0",
      showBanner:    false,
    };

    var canvas    = document.getElementById("unity-canvas");
    var loading   = document.getElementById("loading-screen");
    var bar       = document.getElementById("progress-bar");
    var pctLabel  = document.getElementById("loading-pct");

    // 캔버스를 화면 전체로
    canvas.style.width  = "100vw";
    canvas.style.height = "100vh";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, progress => {
        var pct = Math.round(progress * 100);
        bar.style.width = pct + "%";
        pctLabel.textContent = pct + "%";
      }).then(instance => {
        loading.style.display = "none";
        // 전체화면 요청 (태블릿)
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        }
      }).catch(msg => {
        pctLabel.textContent = "오류: " + msg;
        pctLabel.style.color = "#c00";
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
